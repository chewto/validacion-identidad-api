version: '3.8'

services:
  api:
    build: .
    container_name: validacion-identidad-api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DB_COL_URI=${DB_COL_URI}
      - DB_HON_URI=${DB_HON_URI}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-10}
      - DB_READ_TIMEOUT=${DB_READ_TIMEOUT:-30}
      - DB_WRITE_TIMEOUT=${DB_WRITE_TIMEOUT:-30}
    volumes:
      # Bind mount de solo lectura de los certificados SSL / mTLS desde el host
      - ${SSL_PATH:-/etc/ssl/mariadb}:/ssl:ro
      - ./Logs/ekyc:/Logs/ekyc
